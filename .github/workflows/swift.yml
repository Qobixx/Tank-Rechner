
name: Build Tank-Rechner

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Xcode Projekte anzeigen
        run: find . -maxdepth 3 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \)

      - name: Xcode Schemas anzeigen
        run: xcodebuild -list
