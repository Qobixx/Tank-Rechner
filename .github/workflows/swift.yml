

name: Build Tank-Rechner

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Xcode Version prüfen
        run: |
          xcodebuild -version
          ls -d /Applications/Xcode*.app

      - name: Projektformat prüfen
        run: |
          grep -n "compatibilityVersion\|objectVersion" Tank-Rechner.xcodeproj/project.pbxproj
