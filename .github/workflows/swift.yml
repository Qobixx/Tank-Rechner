name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Laufende Builds für denselben Branch abbrechen, wenn neu gepusht wird
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # >>> HIER ANPASSEN <<<
  SCHEME: Tank-Rechner
  PROJECT: Tank-Rechner.xcodeproj
  DESTINATION: platform=iOS Simulator,name=iPhone 17

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint installieren
        run: brew install swiftlint

      - name: Lint ausführen
        run: swiftlint lint --strict --reporter github-actions-logging

  build-and-test:
    name: Build & Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Neuere Xcode-Version wählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: Swift Package Manager Cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build und Tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
