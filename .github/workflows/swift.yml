name: Build Tank-Rechner

on:
push:
pull_request:

jobs:
build:
runs-on: macos-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Show Xcode projects
    run: ls -la
  - name: List schemes
    run: xcodebuild -list -project "Tank-Rechner.xcodeproj"
  - name: Build SwiftUI app
    run: xcodebuild -project "Tank-Rechner.xcodeproj" -scheme "Tank-Rechner" -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO